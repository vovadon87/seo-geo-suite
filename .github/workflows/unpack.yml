name: unpack
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and arrange
        run: |
          set -e
          test -f seo-geo-suite.zip
          rm -rf /tmp/x && mkdir /tmp/x
          unzip -q seo-geo-suite.zip -d /tmp/x
          S=$(dirname "$(find /tmp/x -maxdepth 3 -type d -name seo-geo | head -1)")
          echo "Suite dir: $S"; ls "$S"
          mkdir -p .claude/skills .claude/agents sites evals
          for m in seo-geo tech-audit speed-audit semantics content-geo local-seo seo-report _shared; do
            if [ -d "$S/$m" ]; then cp -r "$S/$m" .claude/skills/; fi
          done
          if [ -d "$S/agents" ]; then cp "$S"/agents/*.md .claude/agents/; fi
          if [ -d "$S/evals" ]; then cp -r "$S"/evals/. evals/; fi
          if [ -f "$S/README.md" ]; then cp "$S/README.md" README.md; fi
          touch sites/.gitkeep
          printf 'audit-out/\nsemantic-out/\noutputs/\n__pycache__/\n*.pyc\n.env\n*.key\nnode_modules/\n' > .gitignore
      - name: Tests
        run: |
          set -e
          for m in tech-audit semantics content-geo local-seo seo-report seo-geo; do
            if [ -f .claude/skills/$m/scripts/run_tests.py ]; then python3 .claude/skills/$m/scripts/run_tests.py; fi
          done
      - name: Commit
        run: |
          find . -name __pycache__ -prune -exec rm -rf {} + || true
          rm -f seo-geo-suite.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack seo-geo-suite: skills, agents, evals"
          git push
